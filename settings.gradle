pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "SpatialLauncher"
include ":app"
// Experimental VR module. Only ever referenced via betaImplementation so the
// release/debug artifacts cannot see it (see app/build.gradle).
include ":vr"
