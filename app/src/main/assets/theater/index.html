<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spatial Theater (spike)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: sans-serif; }
  #hud { position: fixed; left: 12px; top: 12px; z-index: 10; color: #fff;
    background: rgba(0,0,0,.55); padding: 10px 14px; border-radius: 10px;
    font-size: 14px; line-height: 1.5; }
  #hud button { font-size: 16px; padding: 10px 18px; margin-top: 6px;
    border-radius: 8px; border: 0; background: #e65c00; color: #fff; }
  #hud .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: #555; margin-right: 6px; }
  #hud .dot.live { background: #3f6; }
  #frames { display: none; }
</style>
<script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
</head>
<body>
<div id="hud">
  <div><span class="dot" id="livedot"></span><span id="status">waiting for stream…</span></div>
  <div id="info">open <b>http://127.0.0.1:8768/theater</b> in Quest Browser,<br>cast something, then Enter VR</div>
  <button id="enter">Enter VR</button>
</div>
<img id="frames" src="/frame.jpg" alt="">
<script>
(function () {
  var statusEl = document.getElementById('status');
  window.onerror = function (msg, src, line) {
    statusEl.textContent = 'PAGE ERROR: ' + msg + ' @' + line;
  };
  var params = new URLSearchParams(location.search);
  var bothEyes = params.get('eye') === 'both'; // fallback if layers misbehave
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(devicePixelRatio);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050507);
  var camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 60);
  camera.position.y = 1.6; // flat preview matches local-floor eye height

  // Dim room: floor grid + back glow so scale reads in-headset.
  var grid = new THREE.GridHelper(30, 30, 0x222228, 0x111114);
  scene.add(grid);
  var glow = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 12),
    new THREE.MeshBasicMaterial({ color: 0x0a0a12 }));
  glow.position.set(0, 3, -12);
  scene.add(glow);

  // Mirror frames land here, 960px wide cap from the app.
  var img = document.getElementById('frames');
  var canvas = document.createElement('canvas');
  canvas.width = 960; canvas.height = 540;
  var ctx = canvas.getContext('2d');
  // Inside-view of the cylinder mirrors U, so sample with negative repeat.
  // texL = left half unmirrored, texR = right half unmirrored.
  function eyeTexture(offset) {
    var tex = new THREE.CanvasTexture(canvas);
    tex.repeat.x = -0.5; tex.offset.x = offset;
    return tex;
  }
  var texL = eyeTexture(0.5), texR = eyeTexture(1.0);

  // Curved screen at eye height. Per-eye halves are pre-squeezed 2x (SBS), so
  // the arc is sized for the UNSQUEEZED aspect: width = height * fullAspect.
  // Measured live from the stream (mirror aspect varies); scaleX corrects it.
  var R = 5.5, ARC = 1.15, SCREEN_H = 2.6, SCREEN_Y = 1.55;
  var screenMeshes = [];
  // ?tint=1 diagnostics: left mesh RED, right mesh CYAN. Close one eye at a
  // time in VR: left-only-red + right-only-cyan = mapping correct (then any
  // doubling is content/aspect, not layers). Both colors in one eye = layers
  // ignored on this runtime.
  var tinted = params.get('tint') === '1';
  function screenMesh(tex, layer) {
    var geo = new THREE.CylinderGeometry(
      R, R, SCREEN_H, 48, 1, true, Math.PI - ARC / 2, ARC);
    var mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
    if (tinted) mat.color.setHex(layer === 1 ? 0xff4040 : 0x40ffff);
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = SCREEN_Y;
    if (!bothEyes) mesh.layers.set(layer);
    scene.add(mesh);
    screenMeshes.push(mesh);
    return mesh;
  }
  if (bothEyes) {
    var both = new THREE.CanvasTexture(canvas);
    both.repeat.x = -1; both.offset.x = 1;
    var m = new THREE.Mesh(
      new THREE.CylinderGeometry(R, R, SCREEN_H, 48, 1, true, Math.PI - ARC / 2, ARC),
      new THREE.MeshBasicMaterial({ map: both, side: THREE.DoubleSide }));
    m.position.y = SCREEN_Y;
    scene.add(m);
    screenMeshes.push(m);
  } else {
    screenMesh(texL, 1);
    screenMesh(texR, 2);
  }

  // In-scene hint: DOM HUD never renders inside the headset.
  (function () {
    var c = document.createElement('canvas');
    c.width = 1024; c.height = 128;
    var g = c.getContext('2d');
    g.fillStyle = 'rgba(0,0,0,0.0)';
    g.fillRect(0, 0, 1024, 128);
    g.fillStyle = '#fff';
    g.font = '44px sans-serif';
    g.textAlign = 'center';
    g.fillText('Look around. Quest button to exit.', 512, 80);
    var tex = new THREE.CanvasTexture(c);
    var sprite = new THREE.Sprite(
      new THREE.SpriteMaterial({ map: tex, transparent: true }));
    sprite.scale.set(3.2, 0.4, 1);
    sprite.position.set(0, 0.5, -5);
    scene.add(sprite);
  })();

  // Unsqueeze: fit arc width to the live stream aspect (checked 1/sec).
  var lastAspect = 0;
  setInterval(function () {
    if (!img.naturalWidth || !img.naturalHeight) return;
    var aspect = img.naturalWidth / img.naturalHeight;
    if (Math.abs(aspect - lastAspect) / Math.max(0.01, lastAspect) < 0.02) return;
    lastAspect = aspect;
    var s = (SCREEN_H * aspect) / (R * ARC);
    for (var i = 0; i < screenMeshes.length; i++) screenMeshes[i].scale.x = s;
  }, 1000);

  // Session state in-page: proves whether you are really in the headset.
  // In-VR refresh: any controller trigger pull re-arms the feed without
  // leaving the headset (page reload would kill the session). Also wired to
  // the 3D REFRESH slab below for discoverability.
  function refreshFeed() {
    lastAspect = 0;
    lastLoad = 0;
    nosignal.visible = false;
    status.textContent = 'refreshing…';
    img.src = '/frame.jpg?t=' + Date.now();
  }
  (function () {
    var c = document.createElement('canvas');
    c.width = 512; c.height = 128;
    var g = c.getContext('2d');
    g.fillStyle = 'rgba(230,92,0,0.92)';
    g.beginPath();
    g.roundRect ? g.roundRect(6, 14, 500, 100, 22) : g.rect(6, 14, 500, 100);
    g.fill();
    g.fillStyle = '#fff';
    g.font = 'bold 44px sans-serif';
    g.textAlign = 'center';
    g.fillText('REFRESH (trigger)', 256, 80);
    var tex = new THREE.CanvasTexture(c);
    var slab = new THREE.Mesh(
      new THREE.PlaneGeometry(1.7, 0.42),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    slab.position.set(-2.9, 0.5, -5);
    slab.lookAt(camera.position);
    scene.add(slab);
  })();
  function armTriggerRefresh() {
    try {
      var session = renderer.xr.getSession();
      if (!session) return false;
      session.addEventListener('select', refreshFeed);
      return true;
    } catch (e) { return false; }
  }
  renderer.xr.addEventListener('sessionstart', function () {
    status.textContent = 'IN VR — look around, Quest button exits';
    dot.className = 'dot live';
    armTriggerRefresh();
  });
  renderer.xr.addEventListener('sessionend', function () {
    status.textContent = 'back in browser';
  });

  // NO-SIGNAL sprite: distinguishes "no feed" (sprite visible) from a dead
  // page (nothing renders at all). Hidden once frames flow.
  var nosignal = (function () {
    var c = document.createElement('canvas');
    c.width = 1024; c.height = 128;
    var g = c.getContext('2d');
    g.fillStyle = '#fff';
    g.font = '44px sans-serif';
    g.textAlign = 'center';
    g.fillText('NO SIGNAL - cast in the beta app first', 512, 80);
    var tex = new THREE.CanvasTexture(c);
    var sprite = new THREE.Sprite(
      new THREE.SpriteMaterial({ map: tex, transparent: true }));
    sprite.scale.set(4.4, 0.55, 1);
    sprite.position.set(0, SCREEN_Y, -5);
    scene.add(sprite);
    return sprite;
  })();

  var dot = document.getElementById('livedot');
  var status = document.getElementById('status');
  // Snapshot polling (not MJPEG): the OS reclaims Chromium sandboxes around
  // immersive sessions, killing persistent multipart decodes. Stateless
  // per-frame GETs recover on the next poll instead of freezing forever.
  var lastLoad = 0;
  setInterval(function () {
    img.src = '/frame.jpg?t=' + Date.now();
  }, 150);
  img.onload = function () { dot.className = 'dot live'; lastLoad = performance.now(); };
  img.onerror = function () { /* stale frame stays; NO-SIGNAL logic below covers */ };
  var frames = 0, lastT = performance.now(), lastFrameT = 0;
  img.onload = function () { dot.className = 'dot live'; };
  renderer.setAnimationLoop(function () {
    var fed = false;
    try {
      // Fresh snapshots only: a stale img (decoder died) must not repaint.
      if (img.complete && img.naturalWidth > 0 && performance.now() - lastLoad < 1500) {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        texL.needsUpdate = true; texR.needsUpdate = true;
        fed = true;
        frames++;
        var now = performance.now();
        if (now - lastT > 2000) {
          status.textContent = 'LIVE ~' + Math.round(frames * 1000 / (now - lastT)) + ' fps';
          frames = 0; lastT = now;
        }
      }
    } catch (e) { /* transient decode races */ }
    if (fed) {
      lastFrameT = performance.now();
      nosignal.visible = false;
    } else if (performance.now() - lastFrameT > 3000) {
      nosignal.visible = true;
    }
    renderer.render(scene, camera);
  });

  document.getElementById('enter').addEventListener('click', function () {
    if (!navigator.xr) { status.textContent = 'no navigator.xr here'; return; }
    navigator.xr.isSessionSupported('immersive-vr').then(function (ok) {
      if (!ok) { status.textContent = 'immersive-vr not supported'; return; }
      navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] })
        .then(function (s) { renderer.xr.setSession(s); })
        .catch(function (e) { status.textContent = 'session failed: ' + e; });
    });
  });
  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
