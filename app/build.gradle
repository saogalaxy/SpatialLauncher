apply plugin: 'com.android.application'

android {
    namespace "com.spatiallauncher.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.spatiallauncher.app"
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName "0.1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java {
                srcDirs = ['src/main/java']
                // Sandbox PoC stays in-tree under com.spatiallauncher.app.sandbox but
                // must not ship in Quest APKs.
                exclude '**/com/spatiallauncher/app/sandbox/**'
            }
            res.srcDirs = ['src/main/res']
            jniLibs.srcDirs += ['src/main/jniLibs', "${buildDir}/sherpaJni"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    aaptOptions {
        noCompress "tflite", "onnx", "bz2", "gguf", "aa", "ab", "ac"
    }

    packagingOptions {
        // Sherpa JNI needs OrtGetApiBase from its own ORT. Microsoft's copy in
        // onnxruntime-android 1.17.3 is loaded first via pickFirst and Piper then
        // fails with UnsatisfiedLinkError. Prefer sherpa's .so from jniLibs.
        pickFirst 'lib/arm64-v8a/libonnxruntime.so'
        pickFirst 'lib/armeabi-v7a/libonnxruntime.so'
        pickFirst 'lib/x86/libonnxruntime.so'
        pickFirst 'lib/x86_64/libonnxruntime.so'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Plain Android panel app UI — no native/OpenXR dependency anymore. This is a real
    // Horizon OS 2D panel Activity (see AndroidManifest's com.oculus.intent.category.2D),
    // so standard Views/Material widgets are all that's needed; the OS's own panel
    // framework handles window placement, resizing, and pointer/hand input for us.
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // On-device monocular depth estimation (MiDaS v2.1, bundled as assets/midas_depth.tflite)
    // — used to replace the luminance-guess pixel shift with real per-pixel depth-based
    // reprojection for the stereo mirror. See DepthEstimator.java.
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'

    // On-device OCR for Step 2 (dialogue/text from captured frames). Bundled models —
    // no Google Play Services required on Quest.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    // Listen talk turns: same bundled OPUS-MT as OCR (see ListenMtTranslator / TranslateMtService).
    // Do NOT add com.google.mlkit:translate — it pulls Play Services model downloads.

    // Piper first so pickFirst libonnxruntime.so is sherpa's (OrtGetApiBase).
    implementation 'com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v1.13.5'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.3'
    implementation 'org.apache.commons:commons-compress:1.26.2'
    implementation 'net.ladenthin:llama-android-opencl:5.1.0'
    implementation 'org.slf4j:slf4j-nop:2.0.17'
}

def translateAssets = file("src/main/assets/translate")
def piperAssets = file("src/main/assets/models/piper")
def asrAssets = file("src/main/assets/models/asr")
def qwenFastAsset = file("src/main/assets/models/qwen/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf")
// Page Translate = APK-bundled Qwen 2.5 1.5B only (fits with Piper + SenseVoice + OPUS).
def qwenFastBytes = 900_000_000L
def qwenFastUrl = "https://huggingface.co/bartowski/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf"

def downloadTo = { Object... args ->
    String url = (String) args[0]
    File dest = (File) args[1]
    long minBytes = args.length > 2 ? ((Number) args[2]).longValue() : 1024L
    if (dest.exists() && dest.length() >= minBytes) {
        return
    }
    dest.parentFile.mkdirs()
    File tmp = new File(dest.parentFile, dest.name + ".part")
    logger.lifecycle("Downloading ${url}")
    tmp.withOutputStream { out ->
        def conn = new URL(url).openConnection()
        conn.setInstanceFollowRedirects(true)
        conn.setRequestProperty("User-Agent", "SpatialLauncher-offline-pack")
        conn.connectTimeout = 60000
        conn.readTimeout = 600000
        conn.inputStream.withStream { ins ->
            byte[] buf = new byte[1 * 1024 * 1024]
            int n
            long got = 0
            while ((n = ins.read(buf)) >= 0) {
                out.write(buf, 0, n)
                got += n
                if (got % (256L * 1024 * 1024) < n) {
                    logger.lifecycle("  ${dest.name}: ${(got / (1024 * 1024))} MB")
                }
            }
        }
    }
    if (tmp.exists()) {
        dest.delete()
        tmp.renameTo(dest)
    }
}

tasks.register("downloadOfflineModels") {
    description = "Pack Piper (F+M), SenseVoice, OPUS ja/zh/ko→en, and Qwen 1.5B into APK assets (store + sideload)."
    doLast {
        downloadTo(
                "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-amy-low.tar.bz2",
                new File(piperAssets, "vits-piper-en_US-amy-low.tar.bz2"))
        downloadTo(
                "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-ryan-low.tar.bz2",
                new File(piperAssets, "vits-piper-en_US-ryan-low.tar.bz2"))
        downloadTo(
                "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2",
                new File(asrAssets, "sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2"))

        // Drop unused fluency pack if a local tree still has it.
        File staleEnflow = new File(translateAssets, "enflow")
        if (staleEnflow.exists()) {
            staleEnflow.deleteDir()
            logger.lifecycle("Removed unused enflow pack")
        }
        def pairs = [
                [id: "jaen", repo: "Xenova/opus-mt-ja-en"],
                [id: "zhen", repo: "Xenova/opus-mt-zh-en"],
                [id: "koen", repo: "Xenova/opus-mt-ko-en"]
        ]
        pairs.each { pair ->
            def dir = new File(translateAssets, pair.id)
            dir.mkdirs()
            def hf = "https://huggingface.co/${pair.repo}/resolve/main"
            [
                    ["onnx/encoder_model_quantized.onnx", "encoder.onnx"],
                    ["onnx/decoder_model_quantized.onnx", "decoder.onnx"],
                    ["config.json", "config.json"]
            ].each { mapping ->
                downloadTo("${hf}/${mapping[0]}", new File(dir, mapping[1]))
            }
            def tok = new File(dir, "tokenizer.json")
            def pieces = new File(dir, "pieces.tsv")
            if (!pieces.exists() || pieces.length() < 10) {
                downloadTo("${hf}/tokenizer.json", tok)
                def json = new groovy.json.JsonSlurper().parse(tok)
                pieces.withWriter("UTF-8") { w ->
                    def vocab = json.model.vocab
                    if (vocab instanceof Map) {
                        vocab.each { k, v ->
                            String piece = String.valueOf(k).replace("\\", "\\\\").replace("\t", "\\t")
                            w.writeLine(piece + "\t" + v)
                        }
                    } else {
                        vocab.each { row ->
                            String piece = String.valueOf(row instanceof List ? row[0] : row).replace("\\", "\\\\").replace("\t", "\\t")
                            def score = row instanceof List ? row[1] : 0
                            w.writeLine(piece + "\t" + score)
                        }
                    }
                }
                logger.lifecycle("Wrote ${pieces}")
            }
            if (tok.exists()) {
                tok.delete()
            }
        }

        downloadTo(qwenFastUrl, qwenFastAsset, qwenFastBytes)
        if (!qwenFastAsset.exists() || qwenFastAsset.length() < qwenFastBytes) {
            throw new GradleException("Qwen 1.5B download incomplete: ${qwenFastAsset}")
        }
        logger.lifecycle("Qwen 1.5B packed in APK: ${qwenFastAsset.length()} bytes")

        // Drop leftover USB A/B caches so builds don't drag multi-GB unused GGUFs.
        def staleCache = layout.buildDirectory.dir("qwen-cache").get().asFile
        if (staleCache.isDirectory()) {
            staleCache.eachFile { f ->
                if (f.name != qwenFastAsset.name) {
                    logger.lifecycle("Removing unused cache ${f.name}")
                    f.delete()
                }
            }
        }
    }
}

preBuild.dependsOn downloadOfflineModels

afterEvaluate {
    tasks.register("syncSherpaOnnxRuntime") {
        description = "Copy sherpa-onnx libonnxruntime.so so Piper JNI can resolve OrtGetApiBase"
        def destDir = layout.buildDirectory.dir("sherpaJni/arm64-v8a")
        outputs.dir destDir
        doLast {
            def cfg = configurations.findByName("debugRuntimeClasspath")
            if (cfg == null) {
                cfg = configurations.findByName("releaseRuntimeClasspath")
            }
            if (cfg == null) {
                logger.warn("No Android runtime classpath; skip sherpa ORT sync")
                return
            }
            cfg.resolve()
            def aar = cfg.files.find { f ->
                f.name.contains("sherpa-onnx") && f.name.endsWith(".aar")
            }
            if (aar == null) {
                logger.warn("sherpa-onnx AAR not on classpath; Piper native load may fail")
                return
            }
            copy {
                from zipTree(aar)
                include "jni/arm64-v8a/libonnxruntime.so"
                into destDir.get().asFile
                eachFile { fcd ->
                    fcd.path = fcd.name
                }
                includeEmptyDirs = false
            }
            logger.lifecycle("Synced sherpa ONNX Runtime from ${aar.name}")
        }
    }
    tasks.register("syncMicrosoftOrtAsset") {
        description = "Copy Microsoft libonnxruntime.so into assets for the :opusmt process"
        def dest = file("src/main/assets/native/ms_onnxruntime.so")
        outputs.file dest
        doLast {
            if (dest.exists() && dest.length() > 1_000_000) {
                return
            }
            def cfg = configurations.findByName("debugRuntimeClasspath")
            if (cfg == null) {
                cfg = configurations.findByName("releaseRuntimeClasspath")
            }
            cfg.resolve()
            def aar = cfg.files.find { f ->
                f.name.contains("onnxruntime-android") && f.name.endsWith(".aar")
            }
            if (aar == null) {
                throw new GradleException("onnxruntime-android AAR missing")
            }
            dest.parentFile.mkdirs()
            copy {
                from zipTree(aar)
                include "jni/arm64-v8a/libonnxruntime.so"
                into dest.parentFile
                eachFile { fcd ->
                    fcd.path = dest.name
                }
                includeEmptyDirs = false
            }
            logger.lifecycle("Copied Microsoft ORT to ${dest} (${dest.length()} bytes)")
        }
    }
    tasks.named("preBuild").configure { dependsOn("syncSherpaOnnxRuntime", "syncMicrosoftOrtAsset") }
}

